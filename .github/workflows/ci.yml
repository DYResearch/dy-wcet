name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One job per gate.
#
# Until this release every gate but the proofs ran inside a single job named
# "Tests, lints, the no_std build, and the claims audit". Fourteen steps, one
# red cross, and nothing in the summary saying which of them failed. They also
# ran in sequence inside one budget, so a Python script taking half a second
# waited behind a release build of the crate.
#
# Split, the summary names the failure, and the gates needing no Rust report in
# under a minute instead of last.

# Every `uses:` in this file is a commit SHA, enforced by the `workflow` job.
#
# 3.0.0 shipped that gate without doing what it enforces: `dtolnay/rust-
# toolchain@stable` and `Swatinem/rust-cache@v2` had been floating since before
# it, and the first run of the new job failed on ten of them. A tag or a branch
# is a name its owner can repoint; a workflow that resolves `@stable` at run
# time runs whatever that name means today, and this repository's whole claim
# is that the same input gives the same answer.
#
# The SHAs are resolved from the upstream refs, not copied from memory:
#   git ls-remote https://github.com/dtolnay/rust-toolchain stable
#   git ls-remote https://github.com/Swatinem/rust-cache refs/tags/v2.8.0
jobs:
  claims:
    name: Claims and prose agree with the repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Every stated number matches its source
        # The repository makes claims about the crate. Until 0.1.2 nothing
        # checked them, and four were wrong. This is that check.
        run: ./audit.sh --no-cargo

      - name: The prose is measured, not asserted
        # Stock phrases, em-dash density, opener repetition and sentence-length
        # variance, against a baseline taken from this repository's own writing.
        # The 0.1.2 drafts failed it before they passed it.
        run: python3 tools/prose.py

  analysis:
    name: The analysis, checked a second way
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: The recurrence agrees with a simulated schedule
        # The analysis solved two ways. The recurrence, and the schedule it
        # claims to describe, run job by job from the critical instant. Sets
        # with deadlines past the period are included, which is where the
        # single-job form was wrong until 2.0.0.
        run: python3 tools/differential.py

      - name: The paper tests carry their derivations
        # A test asserting a number without showing where the number came from
        # pins the implementation rather than the analysis — and if the
        # implementation is wrong, such a test protects the bug.
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          t = pathlib.Path("tests/on_paper.rs").read_text(encoding="utf-8")
          fns = re.findall(r"((?:///[^\n]*\n|\s*)*)#\[test\]\s*\nfn (\w+)", t)
          bad = [n for doc, n in fns if "→" not in doc and "R = " not in doc
                 and "No derivation" not in doc]
          if bad:
              print(f"::error::these tests assert a value without deriving it: {bad}")
              sys.exit(1)
          print(f"  {len(fns)} paper tests, each with its derivation")
          PY

      - name: No floating point anywhere
        # The property the crate exists for. A single f64 would make the
        # results compiler-dependent, and the promise is that they are not.
        #
        # This checked src/lib.rs alone while the step was named "anywhere".
        # A test or a harness carrying a float would have passed a gate whose
        # name says it would not, which is the same defect audit.sh exists to
        # find in the prose.
        run: |
          if grep -rnE '\bf32\b|\bf64\b' src tests kani \
               | grep -v '^\s*[^:]*:[0-9]*:\s*//' | grep -v 'in `f64`'; then
            echo "::error::floating point in a crate whose point is integer arithmetic"
            exit 1
          fi
          echo "  no floating point in src, tests or kani"

  workflow:
    name: The workflow file is unambiguous
    runs-on: ubuntu-latest
    # Cheap and first. Everything expensive depends on this file being what it
    # looks like.
    #
    # And the limit of this job, stated because 496c232 found it: a validator
    # that lives inside the workflow it validates cannot catch a defect that
    # stops that workflow from loading. GitHub rejected the file before any job
    # started, so this one did not run either. The duplicate `run:` key was
    # invisible to every check in the repository and visible to `yaml.load`
    # with a strict loader in one second. That check belongs before the push,
    # not only inside the thing being pushed.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: No duplicate keys, and every action pinned to a commit
        # A duplicate key is not a style question here. YAML resolves it
        # silently to the last value, so the reviewer sees one job and the
        # runner executes another, and whichever survives is an accident of
        # ordering.
        run: |
          python3 - <<'PY'
          import sys, yaml, pathlib

          class Strict(yaml.SafeLoader):
              pass

          def no_duplicates(loader, node, deep=False):
              seen, out = set(), {}
              for k, v in node.value:
                  key = loader.construct_object(k, deep=deep)
                  if key in seen:
                      print(f"::error::duplicate key {key!r} at line {k.start_mark.line + 1}")
                      sys.exit(1)
                  seen.add(key)
                  out[key] = loader.construct_object(v, deep=deep)
              return out

          Strict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_duplicates)

          bad = 0
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              doc = yaml.load(path.read_text(), Loader=Strict)
              for job_name, job in (doc.get("jobs") or {}).items():
                  if not (job.get("steps") or []):
                      print(f"::error::{path.name}: job {job_name} has no steps")
                      bad = 1
                  for step in job.get("steps") or []:
                      uses = step.get("uses")
                      if uses and "@" in uses:
                          ref = uses.split("@", 1)[1]
                          if len(ref) != 40 or any(c not in "0123456789abcdef" for c in ref):
                              print(f"::error::{path.name}: {uses} is not pinned to a commit")
                              bad = 1
              print(f"  {path.name}: {len(doc.get('jobs') or {})} jobs, no duplicate keys")
          sys.exit(bad)
          PY

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  clippy:
    name: Lints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch
        with: { components: clippy }
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684  # v2.8.0
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684  # v2.8.0
      - run: cargo test

  no_std:
    name: Bare-metal build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch
        with: { targets: thumbv7em-none-eabihf }
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684  # v2.8.0
      - name: no_std against a bare-metal target
        # Verified rather than asserted. A crate that claims no_std and has
        # never been built for a target without std is a crate claiming
        # something nobody checked.
        run: cargo build --release --target thumbv7em-none-eabihf

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684  # v2.8.0
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    name: The published archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch
      - name: The published archive carries its licence text
        # Cargo.toml has declared a dual licence since 0.1.0. Until 0.1.2 the
        # archive shipped neither file.
        run: |
          cargo package --list --allow-dirty | grep -q '^LICENSE-APACHE$'
          cargo package --list --allow-dirty | grep -q '^LICENSE-MIT$'
          echo "  both licence texts are in the archive"

      - name: The tag, the manifest and the changelog agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          man=$(grep -m1 -oE '^version *= *"[^"]+"' Cargo.toml | cut -d'"' -f2)
          log=$(grep -m1 -oE '^## \[[0-9][^]]*\]' CHANGELOG.md | tr -d '#[] ')
          echo "  tag $tag · manifest $man · changelog $log"
          test "$tag" = "$man" && test "$tag" = "$log"

  # There were two `proofs:` keys here, the first with an empty `steps:`. YAML
  # keeps the last duplicate silently, so the job that ran was the second one
  # and the file looked fine. Had the order been the other way round, CI would
  # have reported a green Kani job that executed nothing — a badge for proofs
  # that never ran, which is the defect this repository already fixed once at
  # 1.2.1 and reintroduced in its own workflow. The `workflow` job below now
  # fails on a duplicate key rather than trusting the reader to spot one.
  proofs:
    name: Kani harnesses (advisory — not verifying yet)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Advisory, and the job name says so rather than a comment saying so.
    #
    # The harnesses do not currently complete. 3.0.6 fixed the unwinding
    # assertions by reducing the caps under cfg(kani) — the trace went from
    # iteration 880 to 13 — and what is left is solver time: the step ends on
    # exit 124, which is the per-harness budget, not a failed check. A gate
    # that cannot pass should not block a release whose other forty-eight
    # checks are green, and it must not be reported as passing either. So it
    # runs, it is visible, it says what happened in the run summary, and it
    # does not gate.
    #
    # This comes back to required the moment one green run exists. README and
    # audit.sh both carry the claim that it is advisory; if the job stops
    # being advisory and the README is not updated, `Claims and prose agree
    # with the repository` fails.
    continue-on-error: true
    env:
      # Pinned. Kani's newest release is 0.68.0 — its numbering is 0.x, there
      # is no 3.7.1 in it.
      KANI_VERSION: "0.68.0"
      KANI_BUDGET: "360"
      # Tried in order, first one that closes a harness wins. CaDiCaL is what
      # CBMC bit-blasts to by default; the expensive harnesses are dominated by
      # 64-bit integer division and checked multiplication, which an SMT solver
      # reasons about in the bit-vector theory instead of blasting to SAT. That
      # is a theory argument, not a measurement — nothing here has been timed,
      # because Kani does not run in the environment this was written in. The
      # ladder exists so that one CI run produces the measurement.
      KANI_SOLVERS: "default kissat z3 minisat"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable branch

      # Building kani-verifier from source takes most of this job's budget and
      # produces the same binary every time. The driver and the CBMC toolchain
      # that `cargo kani setup` fetches are cached together: caching one without
      # the other leaves a driver that cannot find its checker.
      - id: kani-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.2.0
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani-driver
            ~/.kani
          # The version is in the key. It was not, and that made the cache the
          # real pin: whatever `cargo install kani-verifier` resolved the first
          # time stayed installed forever, and changing the install line would
          # have had no effect until something else busted the cache. An
          # unpinned install behind a version-blind cache is the bandit defect
          # with an extra layer — the gate's behaviour fixed by accident, at a
          # value nobody chose and nobody can read.
          key: kani-${{ runner.os }}-${{ env.KANI_VERSION }}

      # Through 1.2.1 the README said "run them with cargo kani" and the
      # harnesses were not declared anywhere, so a clean clone ran nothing.
      # The badge counted proofs that no gate enforced. This is that gate.
      - if: steps.kani-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked kani-verifier@"$KANI_VERSION"
          cargo kani setup

      # A cache restored from an older key, or a partially written one, leaves
      # a binary that does not match the pin. Check rather than assume: the
      # whole point of pinning is lost if the pinned value is never compared
      # with what is on disk.
      - name: The installed Kani is the pinned one
        run: |
          have="$(cargo kani --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "   pinned $KANI_VERSION, installed ${have:-none}"
          if [ "$have" != "$KANI_VERSION" ]; then
            echo "::warning::reinstalling: the cache held ${have:-nothing}, not $KANI_VERSION"
            cargo install --locked --force kani-verifier@"$KANI_VERSION"
            cargo kani setup
          fi

      # CBMC ships CaDiCaL and MiniSat. The others have to come from somewhere,
      # and a solver that is absent must not be reported as a solver that
      # failed — that conflation is the one this repository keeps finding.
      - name: Extra solvers, best effort
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq z3 minisat || true
          for s in z3 minisat kissat cadical; do
            if command -v "$s" >/dev/null 2>&1; then echo "   $s: $($s --version 2>&1 | head -1)"; else echo "   $s: not installed"; fi
          done

      # One harness at a time, each with its own budget.
      #
      # `cargo kani` ran all six as a single command. When it stalled, the job
      # hit its thirty-minute limit and was cancelled after six thousand lines
      # of CBMC unwinding trace — without once naming the harness that was
      # stuck. From the summary, "cancelled" and "disproved" look the same, and
      # neither says where to look.
      #
      # The loop in that trace is `Flatten<Take<slice::Iter<Option<Task>>>>::next`
      # at iteration 880: the task array walked *inside* the response-time
      # recurrence. The flatten is cheap — sixteen elements — and the loop
      # around it is what multiplies, up to ITERATION_CAP. 3.0.2 gave the two
      # harnesses that had no unwind bound one each, which is probably the
      # whole of it. This is what will say so either way.
      #
      # Six minutes is far above the seconds a bounded harness takes and far
      # below the point where the job dies. The names come from the source, not
      # from a second list here that would drift away from it.
      - name: Run each harness, escalating the solver until one closes it
        # 3.0.7 ran each harness once and reported "exceeded its budget". That
        # is a fact about one solver, stated as a fact about the harness. The
        # ladder turns this job into the measurement I could not run: for each
        # harness, try the solvers in order and record which one closed it and
        # in how long. One run answers what four releases of guessing did not.
        #
        # Three outcomes stay distinct, because collapsing them is how this
        # repository loses a day: verified, timed out, and solver unavailable.
        # The last is not a failure of anything except the runner's package
        # list.
        run: |
          set -uo pipefail
          harnesses=$(python3 - <<'PY'
          import pathlib, re
          src = pathlib.Path("kani/response_bounds.rs").read_text()
          for m in re.finditer(r"#\[kani::proof\][\s\S]{0,400}?\nfn (\w+)", src):
              print(m.group(1))
          PY
          )
          count=$(echo "$harnesses" | grep -c .)
          [ "$count" -ge 6 ] || { echo "::error::found only $count harnesses"; exit 1; }
          echo "harnesses ($count): $(echo "$harnesses" | tr '\n' ' ')"
          echo "solvers: $KANI_SOLVERS   budget per attempt: ${KANI_BUDGET}s"

          { echo "## Kani harnesses — advisory, not a gate";
            echo;
            echo "Each harness is tried against the solvers in order until one closes it.";
            echo "\`budget\` means it did not fail — it did not finish. \`unavailable\`";
            echo "means the solver binary is not on the runner, which is not a result";
            echo "about the harness at all. This job does not block the build and is not";
            echo "evidence that anything was proved.";
            echo;
            echo "| harness | solver | outcome | time |";
            echo "|---|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"

          unresolved=""
          for h in $harnesses; do
            closed=""
            for solver in $KANI_SOLVERS; do
              if [ "$solver" = "default" ]; then
                args=""
              else
                command -v "$solver" >/dev/null 2>&1 || {
                  echo "   $h / $solver: solver not on this runner, skipped"
                  echo "| \`$h\` | $solver | unavailable | — |" >> "$GITHUB_STEP_SUMMARY"
                  continue
                }
                args="--solver $solver"
              fi
              echo "::group::$h / $solver"
              start=$(date +%s)
              timeout "$KANI_BUDGET" cargo kani --harness "$h" $args
              rc=$?
              took=$(( $(date +%s) - start ))
              echo "::endgroup::"
              if [ $rc -eq 0 ]; then
                echo "   $h / $solver: VERIFIED in ${took}s"
                echo "| \`$h\` | $solver | **verified** | ${took}s |" >> "$GITHUB_STEP_SUMMARY"
                closed="$solver"
                break
              elif [ $rc -eq 124 ]; then
                echo "   $h / $solver: budget (${KANI_BUDGET}s) — did not fail, did not finish"
                echo "| \`$h\` | $solver | budget exceeded | ${KANI_BUDGET}s |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::$h / $solver: failed with exit $rc after ${took}s"
                echo "| \`$h\` | $solver | **failed** (exit $rc) | ${took}s |" >> "$GITHUB_STEP_SUMMARY"
                closed="failed"
                break
              fi
            done
            [ -n "$closed" ] && [ "$closed" != "failed" ] || unresolved="$unresolved $h"
          done

          echo
          if [ -n "$unresolved" ]; then
            echo "::warning::not closed by any solver:$unresolved"
            { echo; echo "Not closed by any solver:$unresolved"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "every harness closed"
          { echo; echo "**Every harness closed.** The job can return to required."; } >> "$GITHUB_STEP_SUMMARY"
